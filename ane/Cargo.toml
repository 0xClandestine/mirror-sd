[package]
name = "mirror-sd-ane"
version = "0.1.0"
edition = "2024"
description = "Python bindings for running DFlash draft model on Apple Neural Engine"

[lib]
name = "mirror_sd_ane"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
ane = { path = "../references/ane/crates/ane" }
